<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- mikado: a quest's chart. Deeds (dots) joined by sticks lead up to the crowning deed (gold). -->
  <rect width="100" height="100" rx="22" fill="#f1e5cb"/>
  <path stroke="#43281f" stroke-width="4.5" stroke-linecap="round" d="M50 24 19 77M50 24l15 27M65 51 50 77M65 51l16 26"/>
  <!-- A parchment ring round each dot leaves the small gap where a stick meets it. -->
  <g stroke="#f1e5cb" stroke-width="3.5">
    <circle cx="50" cy="24" r="11.5" fill="#c78c18"/>
    <g fill="#43281f">
      <circle cx="65" cy="51" r="7.5"/>
      <circle cx="19" cy="77" r="7.5"/>
      <circle cx="50" cy="77" r="7.5"/>
      <circle cx="81" cy="77" r="7.5"/>
    </g>
  </g>
</svg>
